[package]
name = "pixel-buds"
version = "1.0.0"
description = "Unofficial Pixel Buds Desktop Companion"
authors = ["Renev. <info@renev.nl>"]
license = "MIT"
edition = "2024"

[lib]
name = "pixel_buds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
